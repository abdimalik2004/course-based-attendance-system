services:
  mysql:
    image: mysql:8.0
    container_name: attendance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: attendance
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  attendance-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend
    env_file:
      - backend/.env.production
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - mysql
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
